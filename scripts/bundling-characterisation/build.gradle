// Characterisation harness: runs em-stitching-api's REAL rendering classes against its own
// fixtures and records golden semantic facts for the SDK's document-bundling module.
// See README.md for the em-stitching commit SHA, the scenario list and how to regenerate.
plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// The read-only em-stitching-api checkout. Override with -PemStitchingDir=/path/to/checkout.
def emStitchingDir = providers.gradleProperty('emStitchingDir')
        .getOrElse("${projectDir}/../../../em-stitching-api")
def sdkModuleDir = "${projectDir}/../../sdk/document-bundling"

sourceSets {
    // Just the EntityAuditEventListener stub; compiled first, no dependencies.
    stub {
    }
    main {
        java {
            // em-stitching's rendering classes and the minimal domain closure they need,
            // compiled straight out of the (never modified) checkout.
            srcDir "${emStitchingDir}/src/main/java"
            // The SDK module's semantic extractor, so goldens are generated with the very
            // same code future regression tests will use for comparison.
            srcDir "${sdkModuleDir}/src/test/java"
            include 'characterisation/**'
            include 'uk/gov/hmcts/ccd/sdk/bundling/testsupport/PdfSemantics.java'
            include 'uk/gov/hmcts/reform/em/stitching/pdf/**'
            include 'uk/gov/hmcts/reform/em/stitching/domain/AbstractAuditingEntity.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/Bundle.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/BundleContainer.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/BundleDocument.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/BundleFolder.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/BundleItemType.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/DocumentImage.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/SortableBundleItem.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/enumeration/ImageRendering.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/enumeration/ImageRenderingLocation.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/enumeration/PageNumberFormat.java'
            include 'uk/gov/hmcts/reform/em/stitching/domain/enumeration/PaginationStyle.java'
        }
        compileClasspath += sourceSets.stub.output
        runtimeClasspath += sourceSets.stub.output
    }
}

dependencies {
    // Must match em-stitching-api exactly so the goldens characterise today's behaviour.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'

    // Compile-time closure of the em-stitching domain entities (annotations only at runtime).
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.orm:hibernate-core:6.6.55.Final'
    implementation 'org.hibernate.orm:hibernate-envers:6.6.55.Final'
    implementation 'com.vladmihalcea:hibernate-types-60:2.21.1'
    implementation 'org.springframework:spring-context:6.2.19'
    implementation 'org.springframework.data:spring-data-jpa:3.5.13'

    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.apache.commons:commons-collections4:4.4'

    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
}

application {
    mainClass = 'characterisation.CharacterisationHarness'
}

tasks.named('run') {
    systemProperty 'emStitchingDir', emStitchingDir
    systemProperty 'outputDir', providers.gradleProperty('outputDir')
            .getOrElse("${sdkModuleDir}/src/test/resources/characterisation")
    systemProperty 'writeGoldenPdfs', providers.gradleProperty('writeGoldenPdfs').getOrElse('true')
}
