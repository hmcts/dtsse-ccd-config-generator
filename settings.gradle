pluginManagement {
    includeBuild 'sdk'
    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
        }
    }
}

includeBuild 'sdk'

gradle.beforeProject { p ->
    if (p.path in [':wa-task-management-api', ':et', ':ia']) {
        // Prevent subproject build.gradle from failing on wrapper { }.
        p.ext.wrapper = { Closure c -> }
    }
    if (p.path == ':et-shared') {
        def etProject = gradle.rootProject.findProject(':et')
        p.ext.jacksonVersion = etProject.jacksonVersion
        p.ext.jacksonAnnotationsVersion = etProject.jacksonAnnotationsVersion
    }
}

def continueOnFailure = gradle.startParameter.continueOnFailure
gradle.afterProject { p ->
    if (p.path == ':ia') {
        // ia-case-api's build.gradle turns on --continue for the whole build; keep the caller's choice.
        gradle.startParameter.continueOnFailure = continueOnFailure
    }
}

include 'test-projects'

include 'e2e'
project(':e2e').projectDir = file('test-projects/e2e')

include 'pcs'
project(':pcs').projectDir = file('test-projects/pcs-api')

include 'nfdiv'
project(':nfdiv').projectDir = file('test-projects/nfdiv-case-api')

include 'sptribs'
project(':sptribs').projectDir = file('test-projects/sptribs-case-api')

include 'adoption'
project(':adoption').projectDir = file('test-projects/adoption-cos-api')

include 'et'
project(':et').projectDir = file('test-projects/et-ccd-callbacks')
include 'et-shared'
project(':et-shared').projectDir = file('test-projects/et-ccd-callbacks/et-shared')

if (file('test-projects/ia-case-api/build.gradle').exists()) {
    include 'ia'
    project(':ia').projectDir = file('test-projects/ia-case-api')
}

include 'ui-component-lib'
project(':ui-component-lib').projectDir = file('frontend/ui-component-lib')

include 'docweave'
project(':docweave').projectDir = file('frontend/docweave')

if (file('ccd-data-store-api').exists()) {
    include 'ccd-data-store-api'
}
if (file('wa-task-management-api/build.gradle').exists()) {
    include 'wa-task-management-api'
}
