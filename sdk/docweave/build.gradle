plugins {
    id 'java-library'
}

repositories {
    maven {
        url = 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
    }
    mavenCentral()
}

dependencies {
    api project(':decentralised-runtime')

    api 'org.springframework:spring-web'
    api 'org.springframework:spring-context'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.github.hmcts:service-auth-provider-java-client:5.3.5'
    compileOnly 'io.github.openfeign:feign-core:13.14'
    implementation('com.github.hmcts:idam-java-client:3.0.5') {
        transitive = false
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Test).configureEach {
    dependsOn tasks.jar
    // Exercise the same JAR-based classloader boundary as bootWithCCD.
    systemProperty 'docweave.restart-test.classpath',
        files(tasks.jar.archiveFile, sourceSets.test.output, configurations.testRuntimeClasspath).asPath
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
    }
}
