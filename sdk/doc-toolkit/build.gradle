dependencies {
    api project(':decentralised-runtime')
    api project(':ccd-config-generator')
    api 'com.github.hmcts:ccd-case-document-am-client:2.0.0'
    implementation 'com.github.hmcts:service-auth-provider-java-client:6.1.2'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-jdbc'
    // The job outbox's stored requests and results.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'io.github.openfeign:feign-core:13.17'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'

    api 'org.slf4j:slf4j-api'

    // Same PDFBox version as em-stitching-api, which the bundle assembly was ported from.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    // Renders HtmlPage sources in-process; built on the same PDFBox version.
    implementation 'io.github.openhtmltopdf:openhtmltopdf-pdfbox:1.1.110'
    // Parses HtmlPage bodies, which need not be well-formed XHTML.
    implementation 'org.jsoup:jsoup:1.21.2'

    testImplementation project(':ccd-sdk-test-support')
    testImplementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.3')
    testImplementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Rendering and image decoding must not depend on a display, locally or in CI.
    systemProperty 'java.awt.headless', 'true'
    // ./gradlew -p sdk :doc-toolkit:test -PupdateGoldens rewrites the golden files.
    systemProperty 'conversion.updateGoldens', project.hasProperty('updateGoldens')
    systemProperty 'conversion.goldenDir', file('src/test/resources/golden').absolutePath
}
