import org.springframework.boot.gradle.plugin.SpringBootPlugin

dependencies {
    api platform(SpringBootPlugin.BOM_COORDINATES)
    api project(':ccd-config-generator')
    api project(':decentralised-runtime')
    api 'org.springframework.boot:spring-boot-starter-test'
    api 'org.springframework.boot:spring-boot-starter-webmvc-test'
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api('org.springframework.boot:spring-boot-starter-webmvc') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
    }
    api 'org.springframework.boot:spring-boot-jackson2'
    api 'org.testcontainers:testcontainers-postgresql'
    api 'org.testcontainers:testcontainers-jdbc'
    api('com.github.hmcts.rse-cft-lib:ccd-lib:0.19.2186') {
        transitive = false
    }
    api('com.github.hmcts:idam-java-client:3.1.0') {
        transitive = false
    }
    implementation 'com.github.hmcts:service-auth-provider-java-client:6.1.2'
    compileOnly 'io.github.openfeign:feign-core:13.15'
    testImplementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.3')
    testImplementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    api 'org.springframework.boot:spring-boot-starter-flyway'
    api 'org.flywaydb:flyway-database-postgresql'
    api 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
