dependencyManagement {
    imports {
        // Versions ccd-case-document-am-client's transitive spring-cloud-starter-openfeign.
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3'
    }
}

dependencies {
    // Exposes uk.gov.hmcts.ccd.sdk.type (Document, ListValue, YesOrNo), which the CcdBundle
    // output format and StoredBundle map onto.
    api project(':ccd-config-generator')
    api 'com.fasterxml.jackson.core:jackson-annotations'
    api 'org.slf4j:slf4j-api'
    // Metrics API only; bound to the consumer's registry when one is provided.
    api 'io.micrometer:micrometer-core'
    // The CDAM adapters surface CaseDocumentClientApi and Classification to consumers.
    api 'com.github.hmcts:ccd-case-document-am-client:1.59.2'

    // Same PDFBox version as em-stitching-api, so the ported rendering code stays a direct port
    // while the characterisation goldens are established.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // The outbox's module-owned ObjectMapper needs java.time support at runtime.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // ccd-case-document-am-client's Gradle metadata exposes no compile dependencies (its pom
    // marks everything runtime), so the CDAM adapters need these two directly.
    implementation 'org.springframework:spring-web'
    implementation 'io.github.openfeign:feign-core'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-jdbc'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    // The job outbox's optional self-migration; consumers without Flyway back off cleanly.
    compileOnly 'org.flywaydb:flyway-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
