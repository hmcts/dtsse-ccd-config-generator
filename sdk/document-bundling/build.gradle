dependencies {
    api project(':decentralised-runtime')

    api 'org.slf4j:slf4j-api'
    // Metrics API only; bound to the consumer's registry when one is provided.
    api 'io.micrometer:micrometer-core'
    api 'com.fasterxml.jackson.core:jackson-annotations'

    // Same PDFBox version as em-stitching-api, so the ported rendering code stays a direct port
    // while the characterisation goldens are established.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    // The job outbox's module-owned ObjectMapper; java.time support for the persisted request.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    // Optional components on the presentation record round-trip through the job outbox.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-jdbc'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
